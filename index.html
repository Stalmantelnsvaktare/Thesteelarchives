<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>STEEL ARCHIVES</title>

    <meta name="description"
        content="Endast utvalda äger tillträde.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Bakgrund -->

    <div class="background">
        <div class="background-overlay"></div>
        <div class="background-glow"></div>
    </div>

    <!-- Huvudinnehåll -->

    <main class="container">

        <!-- Header -->

        <header class="hero">

            <h1>STEEL ARCHIVES</h1>

            <p class="subtitle">
                Endast utvalda äger tillträde.
            </p>

        </header>

        <!-- Ward -->

        <section class="ward-section">

            <div class="ward-container">

                <img
                    id="ward"
                    src="assets/ward.svg"
                    alt="Skyddsward">

            </div>

        </section>

        <!-- Integritet -->

        <section class="panel">

            <h2>Förseglingens integritet</h2>

            <div id="integrity" class="integrity-value">

                100%

            </div>

        </section>

        <!-- Nedräkning -->

        <section class="panel">

            <h2>Nästa försegling bryts om</h2>

            <div id="countdown" class="countdown">

                -- dagar -- timmar -- minuter

            </div>

        </section>

        <!-- Uppdrag -->

        <section class="missions-section">

            <h2>Förseglade uppdrag</h2>

            <div
                id="missionsGrid"
                class="missions-grid">

                <!-- Skapas av script.js -->

            </div>

        </section>

        <!-- Arkivlogg -->

        <section class="panel">

            <h2>Arkivlogg</h2>

            <div id="archiveLog">

                <p>
                    Arkivet väntar på första aktivering.
                </p>

            </div>

        </section>

        <!-- Footer -->

        <footer>

            <div class="footer-line"></div>

            <p class="footer-title">
                STEEL ARCHIVES
            </p>

            <p class="footer-version">
                Version 1.0
            </p>

        </footer>

    </main>

    <script src="script.js"></script>

</body>

</html>
